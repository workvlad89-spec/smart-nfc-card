<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Old Kair</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background: #0b0b0b;
            color: white;
            font-family: Arial, Helvetica, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .page {
            width: 100%;
            max-width: 430px;
            min-height: 100vh;

            display: flex;
            flex-direction: column;
            align-items: center;

            padding: 55px 24px 35px;
        }

        .logo {
            width: 150px;
            height: 150px;

            object-fit: contain;

            margin-bottom: 28px;
        }

        .message {
            font-size: 22px;
            font-weight: 500;
            letter-spacing: 0.3px;

            margin-bottom: 38px;

            text-align: center;
        }

        .links {
            width: 100%;

            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .link {
            width: 100%;
            height: 62px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 16px;

            background: #171717;

            color: white;
            text-decoration: none;

            font-size: 28px;

            border: 1px solid #292929;

            transition: 0.2s ease;
        }

        .link:hover {
            transform: translateY(-2px);
            background: #222;
        }

        .link:active {
            transform: scale(0.98);
        }

        .google {
            background: #ffffff;
            color: #111;
        }

        .google:hover {
            background: #eeeeee;
        }

        .footer {
            margin-top: auto;
            padding-top: 40px;

            font-size: 11px;
            color: #555;
        }
    </style>
</head>

<body>

<div class="page">

    <img
        src="logo.png"
        alt="Old Kair"
        class="logo"
    >

    <div class="message">
        Dziękujemy za wizytę
    </div>

    <div class="links">

        <!-- GOOGLE REVIEWS -->
        <a
            class="link google"
            href="https://search.google.com/local/writereview?placeid=ChIJ1Xx6RynDD0cReCkeP0sAmQ0"
            target="_blank"
            aria-label="Google Reviews"
        >
            ⭐
        </a>

        <!-- INSTAGRAM -->
        <a
            class="link"
            href="https://www.instagram.com/oldkair/"
            target="_blank"
            aria-label="Instagram"
        >
            📸
        </a>

        <!-- TIKTOK -->
        <a
            class="link"
            href="https://www.tiktok.com/@oldkair.pl"
            target="_blank"
            aria-label="TikTok"
        >
            ♪
        </a>

        <!-- WEBSITE -->
        <a
            class="link"
            href="https://oldkair.pl/"
            target="_blank"
            aria-label="Website"
        >
            🌐
        </a>

        <!-- PHONE -->
        <a
            class="link"
            href="tel:+48788666670"
            aria-label="Telefon"
        >
            📞
        </a>

        <!-- GOOGLE MAPS -->
        <a
            class="link"
            href="https://www.google.com/maps/search/?api=1&query=Zas%C5%82ucza%C5%84ska+4%2C+55-010+%C5%BBerniki+Wroc%C5%82awskie"
            target="_blank"
            aria-label="Google Maps"
        >
            📍
        </a>

    </div>

    <div class="footer">
        OLD KAIR
    </div>

</div>

</body>
</html>
